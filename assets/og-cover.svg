<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f5f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#6d47d9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0b0d12" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo -->
  <g transform="translate(96 88)">
    <rect width="46" height="46" rx="12" fill="#0b0d12"/>
    <path d="M13.4 29.8c0-3.7 3-6.7 6.7-6.7.7-2.8 3.2-4.9 6.2-4.9 3.4 0 6.2 2.5 6.5 5.7 2.5.5 4.4 2.8 4.4 5.5 0 3-2.5 5.5-5.5 5.5H17.9c-2.5 0-4.5-2.1-4.5-5.1Z" fill="#fff"/>
    <text x="62" y="32" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#0b0d12" letter-spacing="-0.6">Nimbus</text>
  </g>

  <!-- Headline -->
  <text x="96" y="264" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="600" fill="#0b0d12" letter-spacing="-2">让团队的每一次交付</text>
  <text x="96" y="344" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="600" fill="url(#accent)" letter-spacing="-2">清晰可见</text>

  <!-- Subline -->
  <text x="96" y="404" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" fill="#6b7280" letter-spacing="-0.3">需求 · 代码 · 发布，串成一条可追溯的链路。</text>

  <!-- Mock card on the right -->
  <g transform="translate(720 150)">
    <rect width="384" height="330" rx="18" fill="#ffffff" stroke="#dfe3e8" stroke-width="1.5"/>
    <rect x="0" y="0" width="384" height="38" rx="18" fill="#fbfbfc"/>
    <rect x="0" y="26" width="384" height="12" fill="#fbfbfc"/>
    <line x1="0" y1="38" x2="384" y2="38" stroke="#e8eaee" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="4.5" fill="#f0b8b3"/>
    <circle cx="35" cy="19" r="4.5" fill="#f2d7a6"/>
    <circle cx="50" cy="19" r="4.5" fill="#b3ddb8"/>

    <rect x="20" y="58" width="104" height="58" rx="9" fill="#fafafa" stroke="#e8eaee"/>
    <text x="34" y="80" font-family="Inter, sans-serif" font-size="11" fill="#9aa1ab">本周交付</text>
    <text x="34" y="104" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#0b0d12">24</text>

    <rect x="136" y="58" width="104" height="58" rx="9" fill="#fafafa" stroke="#e8eaee"/>
    <text x="150" y="80" font-family="Inter, sans-serif" font-size="11" fill="#9aa1ab">平均周期</text>
    <text x="150" y="104" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#0b0d12">2.4<tspan font-size="11" font-weight="400" fill="#9aa1ab">天</tspan></text>

    <rect x="252" y="58" width="112" height="58" rx="9" fill="#fafafa" stroke="#e8eaee"/>
    <text x="266" y="80" font-family="Inter, sans-serif" font-size="11" fill="#9aa1ab">阻塞项</text>
    <text x="266" y="104" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#0b0d12">3</text>

    <!-- chart -->
    <rect x="20" y="130" width="344" height="84" rx="9" fill="#fff" stroke="#e8eaee"/>
    <path d="M32 194 L76 186 L120 190 L164 172 L208 178 L252 158 L296 162 L340 142 L352 138"
          fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- rows -->
    <rect x="20" y="228" width="58" height="20" rx="10" fill="#eff4ff"/>
    <text x="32" y="242" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#1d4ed8">进行中</text>
    <text x="90" y="243" font-family="Inter, sans-serif" font-size="12" fill="#3a4049">统一登录入口重构</text>

    <rect x="20" y="256" width="58" height="20" rx="10" fill="#ecfdf3"/>
    <text x="32" y="270" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#15803d">已完成</text>
    <text x="90" y="271" font-family="Inter, sans-serif" font-size="12" fill="#3a4049">流水线缓存优化</text>

    <rect x="20" y="284" width="58" height="20" rx="10" fill="#fff7ed"/>
    <text x="32" y="298" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#d97706">待评审</text>
    <text x="90" y="299" font-family="Inter, sans-serif" font-size="12" fill="#3a4049">告警降噪规则 v2</text>
  </g>
</svg>
